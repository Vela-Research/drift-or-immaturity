[project]
name = "drift-or-immaturity"
version = "1.0.0"
description = "Code of the paper 'Drift or Immaturity? Correcting for Maturity Matters, Learning a Young Cohort's Own Timing Rarely Helps': the experiments as run"
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pyfixest==0.60.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maturity"]
